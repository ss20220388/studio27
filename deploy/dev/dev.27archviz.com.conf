# nginx za dev server: /etc/nginx/sites-available/dev.27archviz.com.conf
# https posle toga dodaje certbot (postavi.sh ispisuje tačnu komandu).
# Svaki odgovor ima X-Robots-Tag noindex: dev ne sme na Google (kopija sajta bi štetila produkciji).

# Sajt
server {
    listen 80;
    server_name dev.27archviz.com;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/studio27-proxy.conf;
    }
}

# Admin
server {
    listen 80;
    server_name admin.dev.27archviz.com;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 5G;

    location / {
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/snippets/studio27-proxy.conf;
    }
}

# Web aplikacija (kupljeni kursevi)
server {
    listen 80;
    server_name app.dev.27archviz.com;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:5000;
        include /etc/nginx/snippets/studio27-proxy.conf;
    }
}

# API (Spring Boot) + slike iz /assets
server {
    listen 80;
    server_name api.dev.27archviz.com;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # upload videa iz admina (isto kao spring.servlet.multipart)
    client_max_body_size 5G;

    # /api/uploaded-images/uploads/X.webp -> /assets/uploads/X.webp
    # Proveri na produkciji: grep -rn uploaded-images /etc/nginx/  (mora da pokazuje na isti folder)
    location /api/uploaded-images/ {
        alias /assets/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/studio27-proxy.conf;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }
}
